<!doctype html>
<html lang="en" class="no-js">
<head>

  <title>Gallery – Mercy Seat Chapel</title>
  <meta name="description" content="Photos from worship services and ministries at Mercy Seat Chapel.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

<body>
  <div data-site-header></div>

  <main id="main">
    <section class="page-hero">
      <div class="page-hero__bg" style="background-image:url('assets/images/church-1709.jpg')"></div>
      <div class="container">
        <ol class="crumbs"><li><a href="index.html">Home</a></li><li>Gallery</li></ol>
        <h1>Gallery</h1>
        <p>Moments of worship, fellowship and service from the life of our church family.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow">Life at Mercy Seat</span>
          <h2>See what God is <em>doing</em></h2>
          <p>Hover over a photo to pause it, then select any photo to view it larger.</p>
        </div>
      </div>

      <!-- HOW TO ADD A PHOTO: copy one <li> below and change the image file (twice) and the
           alt text (it is also the caption). main.js turns this list into three full-width
           scrolling rows; without JavaScript it shows as a plain grid. -->
      <div class="photo-rows" data-gallery>
        <div class="container">
          <ul class="gallery">
            <li><a class="gallery__item" href="assets/images/church-1705.jpg"><img src="assets/images/church-1705.jpg" alt="The choir leading praise as the congregation stands in worship" loading="lazy"></a></li>
            <li><a class="gallery__item" href="assets/images/hero-3.jpg"><img src="assets/images/hero-3.jpg" alt="The choir ministering in song" loading="lazy"></a></li>
            <li><a class="gallery__item" href="assets/images/church-1706.jpg"><img src="assets/images/church-1706.jpg" alt="Members standing together during praise and worship" loading="lazy"></a></li>
            <li><a class="gallery__item" href="assets/images/church-1709.jpg"><img src="assets/images/church-1709.jpg" alt="Worshippers lifting their hands as the choir sings" loading="lazy"></a></li>
            <li><a class="gallery__item" href="assets/images/hero-4.jpg"><img src="assets/images/hero-4.jpg" alt="A smiling member worshipping during a Sunday service" loading="lazy"></a></li>
            <li><a class="gallery__item" href="assets/images/church-1716.jpg"><img src="assets/images/church-1716.jpg" alt="Members of all ages standing in worship" loading="lazy"></a></li>
            <li><a class="gallery__item" href="assets/images/hero-2-sm.jpg"><img src="assets/images/hero-2-sm.jpg" alt="A worshipper in prayer during a service" loading="lazy"></a></li>
            <li><a class="gallery__item" href="assets/images/children-2.jpg"><img src="assets/images/children-2.jpg" alt="Children and teens of Mercy Seat Chapel" loading="lazy"></a></li>
            <li><a class="gallery__item" href="assets/images/revive-1.jpg"><img src="assets/images/revive-1.jpg" alt="Young adults of the Revive ministry" loading="lazy"></a></li>
            <li><a class="gallery__item" href="assets/images/revive-2.jpg"><img src="assets/images/revive-2.jpg" alt="Young adults of the Revive ministry together" loading="lazy"></a></li>
            <li><a class="gallery__item" href="assets/images/hero-1.jpg"><img src="assets/images/hero-1.jpg" alt="Members of the Pillars of Mercy women’s ministry" loading="lazy"></a></li>
          </ul>
        </div>
      </div>
    </section>

  <div data-site-footer></div>
